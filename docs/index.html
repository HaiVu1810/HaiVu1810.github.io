<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise AI Translation Platform</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="app-container" id="translationView">
        <header class="app-header">
            <h1>AI Document Translation Platform</h1>
            <p>Bảo toàn định dạng tài liệu & Tối ưu hóa Termbase Glossary</p>
        </header>

        <main class="card">
            <form id="translationForm">
                <div class="form-group">
                    <label for="documentFile">1. Upload document (.docx or .pptx, max 50 MB):</label>
                    <input type="file" id="documentFile" accept=".docx,.pptx" required>
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="useGlossaryToggle" checked>
                        Enable glossary
                    </label>
                </div>

                <div class="form-group" id="glossaryUploadGroup">
                    <label for="glossaryFile">2. Upload glossary (.xlsx, .csv, .json):</label>
                    <input type="file" id="glossaryFile" accept=".xlsx, .csv, .json">
                    <small>Supported columns: Source, Target, non_translatable</small>
                </div>

                <div class="form-row">
                    <div class="form-group half">
                        <label for="targetLanguage">Target language:</label>
                        <select id="targetLanguage">
                            <option value="Vietnamese">Vietnamese</option>
                            <option value="English">English</option>
                        </select>
                    </div>
                    <div class="form-group half">
                        <label for="modelSelect">Translation methodology:</label>
                        <select id="modelSelect">
                            <!-- <option value="google">Google Translate</option> -->
                            <option value="deepl">DeepL Translate</option>
                            <option value="debug">Debug nhanh (không gọi API)</option>
                        </select>
                    </div>
                </div>

                <button type="submit" id="submitBtn">Dịch tài liệu</button>
                <!-- DOCX Live Editor quick-import is intentionally hidden for the demo. -->
                <input type="file" id="quickEditorFileInput" accept=".docx" hidden>
            </form>

            <div id="statusBox" class="status-box hidden"></div>
            <div id="progressPanel" class="progress-panel hidden" aria-live="polite">
                <div class="progress-meta"><span id="progressLabel">Đang chuẩn bị...</span><span
                        id="progressValue" aria-hidden="true"></span></div>
                <div class="progress-track">
                    <div id="progressBar" class="progress-bar"></div>
                </div>
            </div>

        </main>
    </div>

    <section class="editor-view hidden" id="editorView">
        <header class="editor-header">
            <div>
                <p class="eyebrow">TRANSLATED DOCUMENT</p>
                <h1 id="editorTitle">Document editor</h1>
                <p class="editor-subtitle">Nội dung đã dịch sẵn sàng để rà soát. Header, footer, font và bố cục được giữ
                    từ tài liệu gốc.</p>
            </div>
            <div class="editor-actions">
                <!-- Import test file is intentionally hidden for the demo. -->
                <!-- HTML editor is temporarily disabled; comparison uses generated PDFs. -->
                <input type="file" id="editorFileInput" accept=".docx" hidden>
                <button type="button" class="secondary-button" id="backToTranslationBtn">Dịch tài liệu khác</button>
                <button type="button" class="export-button" id="exportBtn">Export tài liệu</button>
            </div>
        </header>
        <div class="editor-shell">
            <!-- HTML editor is disabled for the customer demo. -->
            <!-- <aside class="editor-tools" id="editorTools">
                <div class="navigation-panel">
                    <div class="navigation-heading">
                        <h2>Navigation</h2>
                        <span id="navigationCount">0</span>
                    </div>
                    <div id="navigationList" class="navigation-list">
                        <p class="navigation-empty">Chưa tìm thấy section.</p>
                    </div>
                </div>
            </aside> -->
            <div id="documentEditor" class="demo-editor-placeholder" aria-hidden="true"></div>
            <!-- Comparison/review UI is disabled until it is needed again.
            <aside class="preview-modal preview-panel hidden" id="previewModal">
                <section class="preview-dialog">
                    <div class="preview-frame-wrap">
                        <div class="comparison-pdf-viewers">
                            <section><h3>Original (glossary highlights)</h3><div id="sourcePdfViewer"
                                class="preview-pdf-viewer" aria-label="Original PDF preview"></div></section>
                            <section><h3>Translated (glossary highlights)</h3><div id="previewPdfViewer"
                                class="preview-pdf-viewer" aria-label="Translated PDF preview"></div></section>
                        </div>
                    </div>
                </section>
            </aside> -->
        </div>
    </section>

    <!-- <script src="translation_memory/translation-memory.js"></script> -->
    <!-- Set the public backend URL in config.js before deploying this folder. -->
    <script src="config.js"></script>
    <script src="app.js"></script>
</body>

</html>
