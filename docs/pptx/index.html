<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PowerPoint Editor</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="topbar">
        <div>
            <span class="eyebrow">PRESENTATION EDITOR</span>
            <h1 id="fileTitle">PowerPoint editor</h1>
        </div>
        <div class="top-actions">
            <button id="backButton" class="secondary-button" type="button">Dịch tài liệu khác</button>
            <button id="exportButton" class="primary-button" type="button">Export PPTX</button>
        </div>
    </header>

    <div id="status" class="status hidden" role="status"></div>
    <main class="workspace">
        <aside class="slides-panel">
            <div class="panel-heading">
                <h2>Slides</h2>
                <span id="slideCount">0</span>
            </div>
            <div id="slideList" class="slide-list"></div>
        </aside>
        <section class="stage-wrap">
            <div class="stage-toolbar">
                <span>Click vào text trên slide để sửa</span>
                <span id="editCount">0 thay đổi</span>
            </div>
            <div id="stage" class="stage"></div>
        </section>
    </main>
    <script src="../config.js"></script>
    <script src="app.js"></script>
</body>
</html>
